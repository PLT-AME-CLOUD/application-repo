# Builds Docker images for frontend and backend, pushes them to ECR,
# and triggers an ECS service update to deploy the new containers.

name: Deploy Application

on:
  push:
    branches:
      - main

# Prevent overlapping deploys from racing on ECS service updates
concurrency:
  group: app-deploy
  cancel-in-progress: false

# OIDC token for AWS authentication, read access for checkout
permissions:
  id-token: write
  contents: read

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check app directories
        run: |
          ls -l frontend/Dockerfile || echo "Error: Frontend Dockerfile not found"
          ls -l backend/Dockerfile || echo "Error: Backend Dockerfile not found"
          if [ ! -f frontend/Dockerfile ] || [ ! -f backend/Dockerfile ]; then exit 1; fi

      # Authenticate to AWS using GitHub OIDC — no long-lived credentials stored
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        run: |
          docker build --provenance=false -t ${{ steps.ecr-login.outputs.registry }}/app-repo:frontend-latest frontend/
          docker push ${{ steps.ecr-login.outputs.registry }}/app-repo:frontend-latest

      - name: Build and push backend image
        run: |
          docker build --provenance=false -t ${{ steps.ecr-login.outputs.registry }}/app-repo:backend-latest backend/
          docker push ${{ steps.ecr-login.outputs.registry }}/app-repo:backend-latest

      - name: Update ECS services
        run: |
          aws ecs update-service --cluster ecs-cluster --service frontend-service --desired-count 1 --force-new-deployment
          aws ecs update-service --cluster ecs-cluster --service backend-service --desired-count 1 --force-new-deployment
