# CI caller — thin wrapper that app teams own.
# All build/scan logic lives in ci-reusable.yml (platform-owned).
# App teams can only change the parameters below.

name: CI Pipeline

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  statuses: write

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
    with:
      ecr_repository: app-repo
      aws_region: us-east-1
      services: '[{"name":"frontend","path":"frontend/"},{"name":"backend","path":"backend/"}]'
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
